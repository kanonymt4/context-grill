name: platform-probe

# 索引の書き込み経路が OS ごとにどう振る舞うかを実測する。
# 常時回す性質のものではないので、手で起動したときだけ走らせる。
# 結果の解釈と、これまでに得られた数値は CLAUDE.md の履歴（2026-08-26）を参照。
on: workflow_dispatch

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10'

      - name: 1. fd 保持下のファイル操作（同一プロセス）
        run: node scripts/platform-probe1.mjs

      - name: 2. fd 保持下のファイル操作（別プロセス）
        run: node scripts/platform-probe2.mjs

      - name: 3. MCP サーバー常駐下の sync / search
        run: node scripts/platform-probe3.mjs

      - name: 4. MCP 常駐下で別プロセスの CLI sync
        run: node scripts/platform-probe4.mjs

      - name: 5. 世代番号つきファイル名の unlink 積み残し
        run: node scripts/platform-probe5.mjs

      - name: 6. 世代番号つきファイル名での公開（未使用の名前への rename）
        run: node scripts/platform-probe6.mjs
